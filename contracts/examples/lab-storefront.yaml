# Example contract for the Mutation Lab storefront.
#
# The canary URLs MUST be the exact URLs Bright Data collects — they are the
# join key evaluate() matches dataset rows against, and a canary the rows never
# match is a golden that silently never runs. So they carry the PUBLIC origin,
# always. Copy this file into contracts/, then replace the example collector ID
# and URLs before starting the agent.
scraper: lab-storefront
collector_id: c_example
canaries:
  - url: https://lab.example.com/product/echo-speaker
    goldens:
      title:
        value: "Echo Portable Speaker"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 49.99, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://lab.example.com/product/aurora-lamp
    goldens:
      title:
        value: "Aurora Desk Lamp"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 29.99, tolerance_pct: 20 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://lab.example.com/product/graphite-keyboard
    goldens:
      title:
        value: "Graphite Mechanical Keyboard"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 89.00, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://lab.example.com/product/tidal-bottle
    goldens:
      title:
        value: "Tidal Insulated Bottle"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 24.95, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
fields:
  title: { type: string, required: true, min_len: 3 }
  price: { type: number, required: true, min: 0.5, max: 10000 }
  sale_price: { type: number, required: false }
  availability: { type: string, required: true }
invariants:
  - "sale_price == null || sale_price <= price"
  - "price > 0"
fill_rate_min: 0.9
exclude_fields_containing_pii: true
