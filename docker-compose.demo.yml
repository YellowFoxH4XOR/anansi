services:
  lab:
    build:
      context: ./apps/ui
    environment:
      PORT: "4600"
    ports:
      - "127.0.0.1:${ANANSI_LAB_PORT:-4600}:4600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4600/__state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent:
    build:
      args:
        WITH_BRIGHTDATA_CLI: ${WITH_BRIGHTDATA_CLI:-false}
    environment:
      ANANSI_ADAPTER: ${ANANSI_ADAPTER:-fake}
      ANANSI_LAB_BASE: ${ANANSI_LAB_BASE:-http://lab:4600}
    depends_on:
      lab:
        condition: service_healthy

  console:
    environment:
      ANANSI_MODE: ${ANANSI_ADAPTER:-fake}
