# Contract for the Mutation Lab storefront. The canary URLs below use a
# placeholder origin — either edit them to the deployed Lab URL, or leave them
# and set ANANSI_LAB_BASE (e.g. the Coolify domain) and the scheduler rewrites
# the origin at load time. collector_id: fill in after `brightdata scraper create`.
scraper: lab-storefront
collector_id: c_msyy76jk20f9e9mrh5
canaries:
  - url: https://anansi-lab.vercel.app/product/echo-speaker
    goldens:
      title:
        value: "Echo Portable Speaker"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 49.99, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://anansi-lab.vercel.app/product/aurora-lamp
    goldens:
      title:
        value: "Aurora Desk Lamp"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 29.99, tolerance_pct: 20 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://anansi-lab.vercel.app/product/graphite-keyboard
    goldens:
      title:
        value: "Graphite Mechanical Keyboard"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 89.00, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
  - url: https://anansi-lab.vercel.app/product/tidal-bottle
    goldens:
      title:
        value: "Tidal Insulated Bottle"
        similarity_min: 0.85
        similarity_metric: token_set_ratio
      price: { value: 24.95, tolerance_pct: 15 }
      availability: { one_of: ["in stock", "out of stock"] }
fields:
  title: { type: string, required: true, min_len: 3 }
  price: { type: number, required: true, min: 0.5, max: 10000 }
  sale_price: { type: number, required: false }
  availability: { type: string, required: true }
invariants:
  - "sale_price == null || sale_price <= price"
  - "price > 0"
fill_rate_min: 0.9
cadence_minutes: 30
exclude_fields_containing_pii: true
