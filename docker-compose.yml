services:
  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    environment:
      PORT: "4700"
      ANANSI_DATA: /data
      ANANSI_MODE: ${ANANSI_ADAPTER:-real}
      ANANSI_CONSOLE_USERNAME: ${ANANSI_CONSOLE_USERNAME:-anansi}
      ANANSI_CONSOLE_PASSWORD: ${ANANSI_CONSOLE_PASSWORD:?Set ANANSI_CONSOLE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ANANSI_CONSOLE_PORT:-4700}:4700"
    volumes:
      - anansi-data:/data:ro
    depends_on:
      - agent
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const auth='Basic '+Buffer.from(process.env.ANANSI_CONSOLE_USERNAME+':'+process.env.ANANSI_CONSOLE_PASSWORD).toString('base64');
          fetch('http://127.0.0.1:4700/api/state',{headers:{authorization:auth}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        WITH_BRIGHTDATA_CLI: ${WITH_BRIGHTDATA_CLI:-true}
    environment:
      ANANSI_DATA: /data
      ANANSI_ADAPTER: ${ANANSI_ADAPTER:-real}
      ANANSI_POLL_SECONDS: ${ANANSI_POLL_SECONDS:-10}
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY:?Set BRIGHTDATA_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - anansi-data:/data
    restart: unless-stopped

volumes:
  anansi-data:
